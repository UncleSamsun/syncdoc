name: build-image

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
    outputs:
      digest:
        description: Published immutable image digest
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate component and image name
        id: name
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          case "$COMPONENT" in backend|web) ;; *) exit 1 ;; esac
          context=frontend
          if [ "$COMPONENT" = backend ]; then context=backend; fi
          printf 'context=%s\n' "$context" >> "$GITHUB_OUTPUT"
          printf 'image=ghcr.io/%s-%s\n' "${GITHUB_REPOSITORY,,}" "$COMPONENT" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: ${{ steps.name.outputs.context }}
          push: true
          tags: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.component }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}
