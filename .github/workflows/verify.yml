# PR마다 같은 검사를 같은 방식으로 돌린다. 지금까지는 한 사람의 PC에서 돌린 결과뿐이라
# 다른 환경에서도 통과하는지 근거가 없었다.
name: verify

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

# 같은 브랜치에 새 커밋이 오면 이전 실행을 멈춘다. 오래된 결과를 기다리지 않는다.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 버전은 프로젝트 설정이 고정한 값이다. 여기서 임의로 올리지 않는다.
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # 통합 테스트가 Testcontainers로 PostgreSQL을 띄운다. 기본 러너에 Docker가 있다.
      - name: 테스트
        working-directory: backend
        run: ./gradlew --no-daemon test

      - name: 실패한 테스트 보고서 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: 프런트 테스트와 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: 테스트
        working-directory: frontend
        run: npm run test -- --run

      # 타입 검사까지 함께 돈다. 화면이 깨진 채로 병합되지 않게 한다.
      - name: 빌드
        working-directory: frontend
        run: npm run build

  docs:
    name: 문서 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 검사기는 표준 라이브러리만 쓴다. 설치할 의존성이 없다.
      - name: 검사기 자체 테스트
        working-directory: tools/spec-validator
        run: python -m unittest test_validate

      - name: 문서 검사
        run: python tools/spec-validator/validate.py
